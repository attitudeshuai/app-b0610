server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: marathon-calculator
  
  # CORS配置
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: false
      max-age: 3600

# 日志配置
logging:
  level:
    root: INFO
    com.marathon.calculator: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
